<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tripcast</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/x-icon" href="imgs/icon.ico" />
</head>

<body class="homepage">

  <header class="top-bar">
    <div class="top-bar-left">
      <a href="saved.html" class="top-bar-button book-link" aria-label="Saved plans">
        <img src="icons/book.png" alt="Saved Plans" />
      </a>
    </div>
    <a href="index.html" class="top-bar-title"><img src="imgs/icon.png" alt="" />Tripcast</a>
    <a href="settings.html" class="top-bar-button settings-link" aria-label="Settings">
      <img src="icons/settings.png" alt="Settings" />
    </a>
  </header>

  <main class="hero">
    <h1 class="hero-title">Where To?</h1>
    <form id="trip-form" class="hero-form">
      <input id="destination" class="hero-input" type="text" placeholder="Enter City, Zip Code, or Address"
        aria-label="Destination" required />

      <span id="trip-calendar-label" class="sr-only">Trip Date</span>
      <div id="trip-calendar" class="calendar" role="group" aria-labelledby="trip-calendar-label"
        aria-describedby="selected-date-display"></div>
      <input type="hidden" id="trip-date" name="trip-date" required />
      <p id="selected-date-display" class="selected-date-display">Select a date from the calendar up to 16 days from
        today.</p>

      <button class="confirm-button" type="submit">Confirm</button>
    </form>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav">
      <a href="privacy-policy.html">Privacy Policy</a>
      <span class="footer-separator">•</span>
      <a href="terms-of-services.html">Terms of Services</a>
      <span class="footer-separator">•</span>
      <a href="about.html">About Us</a>
    </nav>
    <p class="footer-copyright">&copy; 2026 Tripcast. All rights reserved.</p>
  </footer>

  <script type="module" src="js/weather-ui.js"></script>
  <script src="js/theme.js"></script>
</body>

</html>
