  <main>
    <h1>Plan a Trip</h1>
    <p>Enter a destination and date to get the weather forecast and activity ideas.</p>

    <form>
      <label for="destination">Destination</label><br />
      <input type="text" id="destination" name="destination" placeholder="e.g. Asheville, NC" /><br /><br />

      <label for="trip-date">Date</label><br />
      <input type="date" id="trip-date" name="trip-date" /><br /><br />

      <button type="submit">Get Forecast</button>
    </form>
  </main>

</body>
