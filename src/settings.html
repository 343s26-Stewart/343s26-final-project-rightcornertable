<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Tripcast</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/x-icon" href="imgs/icon.ico" />
</head>

<body class="settings-page">

    <header class="top-bar">
        <div class="top-bar-left">
            <a href="saved.html" class="top-bar-button book-link" aria-label="Saved plans">
                <img src="icons/book.png" alt="" />
            </a>
            <a href="about.html" class="top-bar-button help-link" aria-label="About">?</a>
        </div>
        <a href="index.html" class="top-bar-title">Tripcast</a>
        <a href="settings.html" class="top-bar-button settings-link" aria-label="Settings">
            <img src="icons/settings.png" alt="" />
        </a>
    </header>

    <main class="settings-main">
        <h1 class="hero-title">Settings</h1>
        <form class="settings-form">
            <div class="settings-row">
                <label for="theme-select">Theme</label>
                <select id="theme-select" name="theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

            <div class="settings-row">
                <label for="units-select">Temperature</label>
                <select id="units-select" name="units">
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="celsius">Celsius</option>
                </select>
            </div>

            <hr class="settings-divider" />
            <h2 class="settings-section-title">Activity Recommendations</h2>

            <div class="settings-row">
                <label for="activity-min-temp">Min. Temperature</label>
                <div class="settings-input-with-unit">
                    <input type="number" id="activity-min-temp" step="1" />
                    <span id="activity-temp-unit">°F</span>
                </div>
            </div>

            <div class="settings-row">
                <label for="activity-max-precip">Max. Precipitation</label>
                <div class="settings-input-with-unit">
                    <input type="number" id="activity-max-precip" step="0.01" min="0" />
                    <span>in</span>
                </div>
            </div>

            <div class="settings-row">
                <label for="activity-max-wind">Max. Wind Speed</label>
                <div class="settings-input-with-unit">
                    <input type="number" id="activity-max-wind" step="1" min="0" />
                    <span>mph</span>
                </div>
            </div>

            <div class="settings-row">
                <label for="activity-radius">Search Radius</label>
                <select id="activity-radius">
                    <option value="500">500 m</option>
                    <option value="1000">1 km</option>
                    <option value="2000">2 km</option>
                    <option value="5000">5 km</option>
                </select>
            </div>

            <fieldset class="settings-row settings-fieldset">
                <legend class="settings-fieldset-legend">Categories</legend>
                <div class="settings-checkboxes">
                    <label class="settings-checkbox-label"><input type="checkbox" name="activity-cat" value="food" /> Food &amp; Drink</label>
                    <label class="settings-checkbox-label"><input type="checkbox" name="activity-cat" value="nature" /> Parks &amp; Nature</label>
                    <label class="settings-checkbox-label"><input type="checkbox" name="activity-cat" value="culture" /> Culture &amp; Attractions</label>
                    <label class="settings-checkbox-label"><input type="checkbox" name="activity-cat" value="entertainment" /> Entertainment</label>
                    <label class="settings-checkbox-label"><input type="checkbox" name="activity-cat" value="fitness" /> Fitness &amp; Sports</label>
                </div>
            </fieldset>

            <!-- <button type="submit" class="confirm-button">Confirm</button> -->
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <button type="button" class="secret-button" id="secret-buttonid">Secret</button>
        </form>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/activity-settings.js"></script>
</body>

</html>
